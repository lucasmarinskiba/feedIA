<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout | FeedIA</title>
  <meta name="robots" content="noindex">
  <style>
    :root {
      --color-primary: #2563eb;
      --color-secondary: #7c3aed;
      --color-success: #10b981;
      --color-warning: #f97316;
      --color-bg: #ffffff;
      --color-text: #1f2937;
      --color-text-light: #6b7280;
      --color-border: #e5e7eb;
      --color-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      --shadow-lg: 0 10px 15px rgba(0,0,0,0.1);
      --shadow-xl: 0 20px 25px rgba(0,0,0,0.15);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: var(--color-text);
      background: linear-gradient(180deg, rgba(37,99,235,0.05) 0%, rgba(124,58,237,0.05) 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      line-height: 1.6;
    }

    .card {
      width: 100%;
      max-width: 440px;
      background: var(--color-bg);
      border: 1px solid var(--color-border);
      border-radius: 20px;
      box-shadow: var(--shadow-xl);
      padding: 40px;
    }

    .back-link {
      display: inline-block;
      color: var(--color-text-light);
      text-decoration: none;
      font-size: 0.9rem;
      margin-bottom: 24px;
    }
    .back-link:hover { color: var(--color-primary); }

    .tier-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      margin-bottom: 16px;
    }
    .tier-badge.free { background: rgba(16,185,129,0.12); color: var(--color-success); }
    .tier-badge.starter { background: rgba(249,115,22,0.12); color: var(--color-warning); }
    .tier-badge.pro { background: rgba(37,99,235,0.12); color: var(--color-primary); }
    .tier-badge.agency { background: rgba(124,58,237,0.12); color: var(--color-secondary); }

    h1 { font-size: 1.6rem; margin-bottom: 6px; }
    .price-line { color: var(--color-text-light); margin-bottom: 28px; font-size: 0.95rem; }
    .price-line strong { color: var(--color-text); font-size: 1.3rem; }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 8px;
    }

    input[type="email"] {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--color-border);
      border-radius: 10px;
      font-size: 1rem;
      margin-bottom: 20px;
      font-family: inherit;
    }
    input[type="email"]:focus {
      outline: none;
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px rgba(37,99,235,0.15);
    }

    .btn {
      width: 100%;
      padding: 14px 20px;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .btn-primary {
      background: var(--color-gradient);
      color: #fff;
      box-shadow: var(--shadow-lg);
    }

    .btn-secondary {
      background: #f3f4f6;
      color: var(--color-text);
      margin-top: 12px;
    }

    .gateway-row {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 4px;
    }

    .note {
      font-size: 0.8rem;
      color: var(--color-text-light);
      margin-top: 20px;
      text-align: center;
    }

    .status-box {
      margin-top: 20px;
      padding: 14px 16px;
      border-radius: 10px;
      font-size: 0.9rem;
      display: none;
    }
    .status-box.show { display: block; }
    .status-box.error { background: rgba(239,68,68,0.1); color: #b91c1c; }
    .status-box.success { background: rgba(16,185,129,0.1); color: #047857; }
    .status-box.pending { background: rgba(249,115,22,0.1); color: #9a3412; }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-right: 8px;
      vertical-align: -2px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <a class="back-link" href="/pricing">&larr; Back to pricing</a>

    <span id="tierBadge" class="tier-badge free">Free</span>
    <h1 id="tierTitle">Start Free</h1>
    <p class="price-line" id="tierPrice"><strong>$0</strong> / month &mdash; 5 campaigns</p>

    <form id="checkoutForm">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">

      <div id="freeAction">
        <button type="submit" class="btn btn-primary" id="freeSubmit">Get Started Free →</button>
      </div>

      <div id="paidAction" class="gateway-row" style="display:none">
        <button type="button" class="btn btn-primary" id="stripeBtn">Pay with Card (Stripe)</button>
        <button type="button" class="btn btn-secondary" id="mpBtn">Pagar con Mercado Pago</button>
      </div>
    </form>

    <div id="statusBox" class="status-box"></div>

    <p class="note">Secure checkout. Cancel anytime. No hidden fees.</p>
  </div>

  <script>
    const API_BASE = 'https://feedia-production.up.railway.app';
    const USER_ID_KEY = 'feedia_user_id';

    const getUserId = () => {
      let id = localStorage.getItem(USER_ID_KEY);
      if (!id) {
        id = (crypto.randomUUID ? crypto.randomUUID() : 'u-' + Date.now() + '-' + Math.random().toString(36).slice(2));
        localStorage.setItem(USER_ID_KEY, id);
      }
      return id;
    };

    const TIERS = {
      free:    { label: 'Free',    priceUsd: '$0',   priceArs: '$0 ARS',        suffix: '/ month — 5 pieces: 3 carousels, 2 stories' },
      starter: { label: 'Starter', priceUsd: '$19',  priceArs: '$29.900 ARS',   suffix: '/ month — 20 pieces: 12 carousels, 6 stories, 2 videos' },
      pro:     { label: 'Pro',     priceUsd: '$79',  priceArs: '$119.900 ARS',  suffix: '/ month — 50 pieces: 25 carousels, 15 stories, 10 videos' },
      agency:  { label: 'Agency', priceUsd: '$499', priceArs: '$749.900 ARS', suffix: '/ month — 500 pieces: 250 carousels, 150 stories, 100 videos' },
    };

    const params = new URLSearchParams(window.location.search);
    const tier = TIERS[params.get('tier')] ? params.get('tier') : 'free';
    const tierData = TIERS[tier];

    document.getElementById('tierBadge').textContent = tierData.label;
    document.getElementById('tierBadge').className = 'tier-badge ' + tier;
    document.getElementById('tierTitle').textContent = tier === 'free' ? 'Start Free' : 'Upgrade to ' + tierData.label;
    document.getElementById('tierPrice').innerHTML = '<strong>' + tierData.priceUsd + '</strong> ' + tierData.suffix
      + (tier !== 'free' ? '<br><span style="font-size:0.85rem">' + tierData.priceArs + ' con Mercado Pago</span>' : '');

    const isPaid = tier !== 'free';
    document.getElementById('freeAction').style.display = isPaid ? 'none' : 'block';
    document.getElementById('paidAction').style.display = isPaid ? 'flex' : 'none';

    const statusBox = document.getElementById('statusBox');
    const showStatus = (kind, message) => {
      statusBox.className = 'status-box show ' + kind;
      statusBox.textContent = message;
    };

    const setBusy = (btn, busy, label) => {
      btn.disabled = busy;
      btn.innerHTML = busy ? '<span class="spinner"></span>Processing…' : label;
    };

    const emailInput = document.getElementById('email');

    // Free tier — POST /api/billing/save-tier, then send them into the app
    document.getElementById('checkoutForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (isPaid) return;
      const email = emailInput.value.trim();
      if (!email) return;
      const btn = document.getElementById('freeSubmit');
      setBusy(btn, true, 'Get Started Free →');
      try {
        const res = await fetch(API_BASE + '/api/billing/save-tier', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId: getUserId(), email, tier: 'free' }),
        });
        const data = await res.json();
        if (!res.ok || !data.success) throw new Error(data.error || 'Signup failed');
        showStatus('success', "You're in! Redirecting to your dashboard…");
        setTimeout(() => { window.location.href = 'https://feedia.vercel.app/#feed'; }, 1200);
      } catch (err) {
        showStatus('error', 'Something went wrong: ' + err.message);
        setBusy(btn, false, 'Get Started Free →');
      }
    });

    // Stripe — POST /api/billing/stripe/checkout → redirect to hosted checkout
    document.getElementById('stripeBtn').addEventListener('click', async () => {
      const email = emailInput.value.trim();
      if (!email) { emailInput.reportValidity(); return; }
      const btn = document.getElementById('stripeBtn');
      setBusy(btn, true, 'Pay with Card (Stripe)');
      try {
        const res = await fetch(API_BASE + '/api/billing/stripe/checkout', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId: getUserId(), email, tier }),
        });
        const data = await res.json();
        if (res.status === 503) {
          showStatus('pending', "Card payments aren't live yet — we'll email you the moment they are.");
          setBusy(btn, false, 'Pay with Card (Stripe)');
          return;
        }
        if (!res.ok || !data.url) throw new Error(data.error || 'Checkout failed');
        window.location.href = data.url;
      } catch (err) {
        showStatus('error', 'Something went wrong: ' + err.message);
        setBusy(btn, false, 'Pay with Card (Stripe)');
      }
    });

    // Mercado Pago — POST /api/billing/create-checkout-session → redirect
    document.getElementById('mpBtn').addEventListener('click', async () => {
      const email = emailInput.value.trim();
      if (!email) { emailInput.reportValidity(); return; }
      const btn = document.getElementById('mpBtn');
      setBusy(btn, true, 'Pagar con Mercado Pago');
      try {
        const res = await fetch(API_BASE + '/api/billing/create-checkout-session', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId: getUserId(), email, tier }),
        });
        const data = await res.json();
        if (!data.url || data.preferenceId?.startsWith('mock_')) {
          showStatus('pending', "Mercado Pago aún no está activo — te avisamos por mail apenas esté listo.");
          setBusy(btn, false, 'Pagar con Mercado Pago');
          return;
        }
        window.location.href = data.url;
      } catch (err) {
        showStatus('error', 'Algo salió mal: ' + err.message);
        setBusy(btn, false, 'Pagar con Mercado Pago');
      }
    });
  </script>
</body>
</html>

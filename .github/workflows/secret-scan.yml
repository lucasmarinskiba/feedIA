name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  trufflehog:
    name: TruffleHog secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # No explicit base/head: the action auto-detects the right range per event type
      # (push: diffs against the commit before the push; pull_request: diffs the PR's
      # range; workflow_dispatch: full scan). Passing an explicit base/head here made
      # them resolve to the SAME commit on a push to main (main's tip IS HEAD right
      # after the push), tripping the action's own "BASE and HEAD are the same" guard
      # and failing the whole scan instead of running it.
      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --debug --only-verified
